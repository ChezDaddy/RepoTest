<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daddy'Pay — Nouvelle adresse</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9f6f0;
      font-family: 'Source Sans 3', sans-serif;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 3.5rem 3rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 32px rgba(0,0,0,0.07);
      border: 1px solid #ede9e0;
    }

    .logo {
      width: 280px;
      max-width: 80%;
      margin: 0 auto 2.5rem;
      display: block;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: #E8A827;
      border-radius: 2px;
      margin: 0 auto 2rem;
    }

    .message {
      font-size: 1.15rem;
      color: #444;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .message strong {
      color: #1f3a4a;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #E8A827;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.01em;
    }

    .btn:hover {
      background: #c98e18;
      transform: translateY(-2px);
    }

    .btn svg {
      flex-shrink: 0;
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
